<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Respirelax 2.0</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Respirelax 2.0">
<meta name="theme-color" content="#11153f">
<link rel="manifest" href="/respirelax/manifest.webmanifest">
<link rel="apple-touch-icon" href="/respirelax/apple-touch-icon.png">
<link rel="icon" href="/respirelax/icon-192.png">
<style>
  :root {
    --bg: #11153f;
    --tube: #1c2378;
    --tube-top: #161c5c;
    --text: #e9ebf7;
    --muted: #a9aed6;
    --accent: #45c8b0;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    -webkit-user-select: none; user-select: none; overscroll-behavior: none; }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    padding: calc(env(safe-area-inset-top) + 24px) 0 calc(env(safe-area-inset-bottom) + 20px); }

  .mode { text-align: center; margin-top: 36px; min-height: 150px; }
  .mode h1 { margin: 0 0 10px; font-size: 26px; font-weight: 700; letter-spacing: .06em; color: #d9dcf0; }
  .mode p { margin: 4px 0; font-size: 15px; letter-spacing: .08em; color: var(--muted); }
  .btn-outline { margin-top: 18px; background: none; color: var(--text); border: 1.5px solid #dfe2f5;
    border-radius: 999px; padding: 7px 18px; font-size: 16px; font-weight: 600; font-family: inherit; }

  .stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; min-height: 0; }
  .tube { position: relative; width: 62px; height: min(400px, 46vh); border-radius: 31px;
    background: linear-gradient(180deg, var(--tube) 0%, #1d2580 60%, #1a2170 100%); overflow: hidden; }
  .tube::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 36px; z-index: 0;
    background: var(--tube-top); border-radius: 31px 31px 0 0; }
  .tube::after { content: ""; position: absolute; left: -10%; right: -10%; top: 26px; height: 20px; z-index: 0;
    background: radial-gradient(ellipse at 50% 0%, var(--tube-top) 60%, transparent 62%); }
  .ball { position: absolute; z-index: 1; left: 50%; width: 54px; height: 54px; margin-left: -27px; border-radius: 50%;
    background:
      radial-gradient(circle at 70% 75%, rgba(120,170,255,.75) 0%, rgba(120,170,255,0) 35%),
      radial-gradient(circle at 35% 30%, #2a4fd0 0%, #1b2fa0 55%, #141f78 100%);
    box-shadow: inset 0 0 0 1px rgba(160,190,255,.35), 0 0 18px rgba(60,100,255,.25);
    will-change: transform; }
  .phase { margin-top: 26px; height: 22px; font-size: 18px; font-weight: 600; color: var(--text); }

  .duration { width: 100%; text-align: center; }
  .duration .label { font-size: 15px; letter-spacing: .08em; color: var(--muted); margin-bottom: 10px; }
  .picker { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none;
    padding: 0 calc(50% - 46px); -webkit-mask-image: linear-gradient(90deg, transparent, #000 25%, #000 75%, transparent); }
  .picker::-webkit-scrollbar { display: none; }
  .picker div { flex: 0 0 92px; scroll-snap-align: center; text-align: center; font-size: 30px; font-weight: 700;
    color: rgba(233,235,247,.45); white-space: nowrap; transition: color .2s; }
  .picker div.sel { color: var(--text); }

  .extras { width: 100%; display: flex; gap: 14px; padding: 18px 24px 0; }
  .round { width: 46px; height: 46px; border-radius: 50%; border: 1.5px solid #dfe2f5; background: none;
    color: var(--text); display: flex; align-items: center; justify-content: center; padding: 0; }
  .round svg { width: 22px; height: 22px; }
  .round.on { background: var(--accent); border-color: var(--accent); }
  .slider-row { padding: 12px 0; font-size: 16px; letter-spacing: .05em; }
  .slider-row div { display: flex; justify-content: space-between; margin-bottom: 10px; }
  .slider-row input { width: 100%; accent-color: var(--accent); }

  .cta { margin: 18px 24px 0; width: calc(100% - 48px); height: 60px; border: 0; border-radius: 999px;
    background: var(--accent); color: #fff; font-size: 21px; font-weight: 700; font-family: inherit;
    display: flex; align-items: center; justify-content: center; gap: 22px; }
  .cta svg { width: 22px; height: 22px; }
  .cta.stop { background: rgba(255,255,255,.12); }

  body.running .mode, body.running .duration { visibility: hidden; }

  .sheet-bg { position: fixed; inset: 0; background: rgba(5,7,25,.6); display: none; align-items: flex-end; z-index: 10; }
  .sheet-bg.open { display: flex; }
  .sheet { width: 100%; background: #1a1f55; border-radius: 22px 22px 0 0;
    padding: 22px 24px calc(env(safe-area-inset-bottom) + 22px); }
  .sheet h2 { margin: 0 0 18px; text-align: center; font-size: 18px; letter-spacing: .06em; }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; font-size: 16px; letter-spacing: .05em; }
  .stepper { display: flex; align-items: center; gap: 14px; }
  .stepper button { width: 42px; height: 42px; border-radius: 50%; border: 1.5px solid #dfe2f5; background: none;
    color: var(--text); font-size: 22px; font-family: inherit; }
  .stepper span { min-width: 58px; text-align: center; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .sheet .cta { margin: 18px 0 0; width: 100%; }
</style>
</head>
<body>
<div id="app">
  <section class="mode">
    <h1>PERSONNALISER</h1>
    <p id="inLabel">INSPIRATION : 7 SEC</p>
    <p id="exLabel">EXPIRATION : 7 SEC</p>
    <button class="btn-outline" id="edit">Modifier</button>
  </section>

  <section class="stage">
    <div class="tube"><div class="ball" id="ball"></div></div>
    <div class="phase" id="phase"></div>
  </section>

  <section class="duration">
    <div class="label">DURÉE</div>
    <div class="picker" id="picker"></div>
  </section>

  <div class="extras">
    <button class="round" id="music" aria-label="Son d'ambiance">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
    </button>
    <button class="round" id="vol" aria-label="Volumes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
    </button>
  </div>

  <button class="cta" id="start">
    <span id="startText">Commencer la séance</span>
    <svg id="startIcon" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M6 3.5v17L20 12z"/></svg>
  </button>
</div>

<div class="sheet-bg" id="sheetBg">
  <div class="sheet">
    <h2>PERSONNALISER</h2>
    <div class="row"><span>INSPIRATION</span>
      <div class="stepper"><button data-k="i" data-d="-1">−</button><span id="iVal"></span><button data-k="i" data-d="1">+</button></div></div>
    <div class="row"><span>EXPIRATION</span>
      <div class="stepper"><button data-k="e" data-d="-1">−</button><span id="eVal"></span><button data-k="e" data-d="1">+</button></div></div>
    <button class="cta" id="ok">Valider</button>
  </div>
</div>

<div class="sheet-bg" id="volBg">
  <div class="sheet">
    <h2>VOLUME</h2>
    <label class="slider-row"><div><span>GONG</span><span id="vgVal"></span></div>
      <input type="range" id="vg" min="0" max="100" step="5"></label>
    <label class="slider-row"><div><span>AMBIANCE</span><span id="vaVal"></span></div>
      <input type="range" id="va" min="0" max="100" step="5"></label>
    <button class="cta" id="volOk">Valider</button>
  </div>
</div>

<audio id="player" playsinline preload="auto"></audio>

<script>
(() => {
  const MIN_S = 2, MAX_S = 15;          // bornes inspiration / expiration (s)
  // 1 à 20 min, puis de 10 en 10 jusqu'à 1 h
  const DURATIONS = [...Array.from({ length: 20 }, (_, i) => i + 1), 30, 40, 50, 60];
  // Fréquence du fichier de séance : réduite pour les longues séances
  // (60 min à 11 025 Hz ≈ 80 Mo) afin de ménager la mémoire de l'iPhone.
  const rateFor = (min) => (min <= 20 ? 22050 : 11025);
  const LEAD = 0.6;                     // silence avant la 1re cloche (s)
  const TAIL = 4;                       // laisse sonner la dernière cloche (s)
  const XFADE = 4;                      // fondu enchaîné de la boucle d'ambiance (s)
  const AMB_IN = 2;                     // fondu d'entrée de l'ambiance (s)

  const $ = (id) => document.getElementById(id);
  const store = {
    get() { try { return JSON.parse(localStorage.getItem("respirelax2") || "{}"); } catch { return {}; } },
    set(v) { try { localStorage.setItem("respirelax2", JSON.stringify(v)); } catch {} },
  };
  const saved = store.get();
  const cfg = {
    i: clamp(saved.i ?? 7, MIN_S, MAX_S),
    e: clamp(saved.e ?? 7, MIN_S, MAX_S),
    min: DURATIONS.includes(saved.min) ? saved.min : 5,
    amb: saved.amb === true,
    vg: clamp(saved.vg ?? 90, 0, 100),   // volume gong (%)
    va: clamp(saved.va ?? 50, 0, 100),   // volume ambiance (%)
  };
  function clamp(v, a, b) { return Math.min(b, Math.max(a, v | 0)); }

  // ---------- Sons ----------
  const samples = {};
  function parseWav(buf) {
    const v = new DataView(buf);
    const ch = v.getUint16(22, true), rate = v.getUint32(24, true), bits = v.getUint16(34, true);
    let p = 12;
    while (p < v.byteLength - 8) {
      const id = String.fromCharCode(v.getUint8(p), v.getUint8(p + 1), v.getUint8(p + 2), v.getUint8(p + 3));
      const size = v.getUint32(p + 4, true);
      if (id === "data") {
        if (bits !== 16) throw new Error("WAV 16 bits attendu");
        const n = Math.floor(size / 2 / ch), out = new Float32Array(n);
        for (let k = 0; k < n; k++) out[k] = v.getInt16(p + 8 + k * ch * 2, true) / 32768;
        return { data: out, rate, cache: {} };
      }
      p += 8 + size + (size & 1);
    }
    throw new Error("WAV sans données");
  }
  function resample(src, from, to) {
    if (from === to) return src;
    const ratio = from / to, n = Math.floor(src.length / ratio), out = new Float32Array(n);
    for (let k = 0; k < n; k++) {             // moyenne sur la fenêtre = filtre passe-bas simple
      const a = Math.floor(k * ratio), b = Math.max(a + 1, Math.floor((k + 1) * ratio));
      let s = 0; for (let j = a; j < b; j++) s += src[j]; out[k] = s / (b - a);
    }
    return out;
  }
  const loading = Promise.all(["inspire", "expire"].map((name) =>
    fetch(`/respirelax/${name}.wav`).then((r) => r.arrayBuffer()).then((b) => { samples[name] = parseWav(b); })
  ));

  // Ambiance : décodée en mono à la fréquence de la séance (un seul décodage par fréquence).
  let ambBytes = null;
  const ambDecoded = {};
  function loadAmbient(rate) {
    if (!ambDecoded[rate]) {
      ambBytes = ambBytes || fetch("/respirelax/ambiance.mp3").then((r) => r.arrayBuffer());
      ambDecoded[rate] = ambBytes.then((b) => new OfflineAudioContext(1, 1, rate).decodeAudioData(b.slice(0)))
        .then((buf) => {
          if (buf.numberOfChannels === 1) return buf.getChannelData(0);
          const a = buf.getChannelData(0), c = buf.getChannelData(1), m = new Float32Array(a.length);
          for (let k = 0; k < a.length; k++) m[k] = (a[k] + c[k]) / 2;
          return m;
        })
        .catch((e) => { delete ambDecoded[rate]; throw e; });
    }
    return ambDecoded[rate];
  }

  // Construit toute la séance dans un seul WAV : c'est ce qui permet à iOS
  // de continuer la lecture quand l'app passe en arrière-plan.
  // Sur iPhone le volume d'un lecteur audio n'est pas réglable par la page :
  // les volumes sont donc appliqués directement dans le mixage.
  const at = (name, rate) => {
    const s = samples[name];
    return s.cache[rate] || (s.cache[rate] = resample(s.data, s.rate, rate));
  };
  function buildSession(s, amb) {
    const OUT_RATE = rateFor(s.min);
    const total = s.min * 60, cycle = s.i + s.e;
    const len = Math.ceil((LEAD + total + TAIL) * OUT_RATE);
    const bytes = new ArrayBuffer(44 + len * 2), v = new DataView(bytes);
    const pcm = new Int16Array(bytes, 44);   // mixage direct en 16 bits : pas de tampon intermédiaire
    const put = (i, x) => { x += pcm[i]; pcm[i] = x > 32767 ? 32767 : x < -32768 ? -32768 : x; };

    if (amb && s.va > 0) {
      // Boucle avec fondu enchaîné à puissance constante entre deux passages.
      const N = amb.length, f = Math.min(Math.round(XFADE * OUT_RATE), N >> 1);
      const fin = Math.round(AMB_IN * OUT_RATE);
      const endStart = Math.round((LEAD + total) * OUT_RATE), endLen = len - endStart;
      const g0 = (s.va / 100) * 32767;
      for (let p = 0, first = true; p < len; p += N - f, first = false) {
        for (let k = 0; k < N && p + k < len; k++) {
          const i = p + k;
          let g = g0;
          if (first ? k < fin : k < f) g *= Math.sin((k / (first ? fin : f)) * Math.PI / 2);
          if (k >= N - f) g *= Math.cos(((k - (N - f)) / f) * Math.PI / 2);
          if (i >= endStart) g *= 1 - (i - endStart) / endLen;   // extinction finale
          put(i, amb[k] * g);
        }
      }
    }

    const gg = (s.vg / 100) * 32767;
    const add = (smp, t) => {
      const o = Math.round((LEAD + t) * OUT_RATE);
      for (let k = 0; k < smp.length && o + k < len; k++) put(o + k, smp[k] * gg);
    };
    if (s.vg > 0) {
      const ins = at("inspire", OUT_RATE), exp = at("expire", OUT_RATE);
      for (let t = 0; t < total; t += cycle) {
        add(ins, t);
        if (t + s.i < total) add(exp, t + s.i);
      }
    }
    const w = (o, s) => { for (let k = 0; k < s.length; k++) v.setUint8(o + k, s.charCodeAt(k)); };
    w(0, "RIFF"); v.setUint32(4, 36 + len * 2, true); w(8, "WAVE"); w(12, "fmt ");
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, OUT_RATE, true); v.setUint32(28, OUT_RATE * 2, true);
    v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, "data"); v.setUint32(40, len * 2, true);
    return new Blob([bytes], { type: "audio/wav" });
  }

  // ---------- Interface ----------
  const picker = $("picker");
  DURATIONS.forEach((m) => { const d = document.createElement("div"); d.textContent = `${m} mn`; d.dataset.m = m; picker.appendChild(d); });
  const items = [...picker.children];
  function markSel() { items.forEach((d) => d.classList.toggle("sel", +d.dataset.m === cfg.min)); }
  function scrollToSel(smooth) {
    const el = items[DURATIONS.indexOf(cfg.min)];
    picker.scrollTo({ left: el.offsetLeft - (picker.clientWidth - el.offsetWidth) / 2, behavior: smooth ? "smooth" : "auto" });
  }
  let scrollT;
  picker.addEventListener("scroll", () => {
    const c = picker.scrollLeft + picker.clientWidth / 2;
    let best = items[0], bd = Infinity;
    for (const d of items) { const dd = Math.abs(d.offsetLeft + d.offsetWidth / 2 - c); if (dd < bd) { bd = dd; best = d; } }
    if (cfg.min !== +best.dataset.m) { cfg.min = +best.dataset.m; markSel(); }
    clearTimeout(scrollT); scrollT = setTimeout(() => store.set(cfg), 200);
  });
  items.forEach((d) => d.addEventListener("click", () => { cfg.min = +d.dataset.m; markSel(); scrollToSel(true); store.set(cfg); }));

  function renderCfg() {
    $("inLabel").textContent = `INSPIRATION : ${cfg.i} SEC`;
    $("exLabel").textContent = `EXPIRATION : ${cfg.e} SEC`;
    $("iVal").textContent = `${cfg.i} s`; $("eVal").textContent = `${cfg.e} s`;
  }
  $("edit").onclick = () => $("sheetBg").classList.add("open");
  $("ok").onclick = () => { $("sheetBg").classList.remove("open"); store.set(cfg); };
  $("sheetBg").addEventListener("click", (e) => { if (e.target === $("sheetBg")) $("ok").onclick(); });
  document.querySelectorAll(".stepper button").forEach((b) => b.addEventListener("click", () => {
    cfg[b.dataset.k] = clamp(cfg[b.dataset.k] + +b.dataset.d, MIN_S, MAX_S); renderCfg();
  }));

  // ---------- Séance ----------
  const player = $("player"), ball = $("ball");
  let url = null, running = false, session = null;

  function setBall(p) { // p : 0 = bas, 1 = haut
    const tube = ball.parentElement, travel = tube.clientHeight - ball.offsetHeight - 8;
    ball.style.transform = `translateY(${4 + (1 - p) * travel}px)`;
  }
  const ease = (x) => 0.5 - 0.5 * Math.cos(Math.PI * x);

  function frame() {
    if (!running) return;
    if (!url) { setBall(0); $("phase").textContent = "Préparation..."; requestAnimationFrame(frame); return; }
    const t = player.currentTime - LEAD, cycle = session.i + session.e, total = session.min * 60;
    if (t < 0) { setBall(0); $("phase").textContent = "Inspirez..."; }
    else if (t >= total) { setBall(0); $("phase").textContent = "Terminé"; }
    else {
      const c = t % cycle;
      if (c < session.i) { setBall(ease(c / session.i)); $("phase").textContent = "Inspirez..."; }
      else { setBall(1 - ease((c - session.i) / session.e)); $("phase").textContent = "Expirez..."; }
    }
    requestAnimationFrame(frame);
  }

  function setRunning(on) {
    running = on;
    document.body.classList.toggle("running", on);
    $("start").classList.toggle("stop", on);
    $("startText").textContent = on ? "Arrêter" : "Commencer la séance";
    $("startIcon").style.display = on ? "none" : "";
    if (on) requestAnimationFrame(frame);
    else { $("phase").textContent = ""; setBall(0); }
  }

  let gen = 0; // invalide une préparation en cours si l'utilisateur arrête entre-temps
  function stop() {
    gen++;
    player.pause(); player.removeAttribute("src"); player.load();
    if (url) { URL.revokeObjectURL(url); url = null; }
    if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "none";
    setRunning(false);
  }

  // Un court silence joué pendant le geste de l'utilisateur « débloque » le lecteur sur iOS :
  // les lectures suivantes (après chargement asynchrone) sont alors autorisées.
  const SILENCE = (() => {
    const n = 800, b = new ArrayBuffer(44 + n * 2), v = new DataView(b);
    const w = (o, s) => { for (let k = 0; k < s.length; k++) v.setUint8(o + k, s.charCodeAt(k)); };
    w(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); w(8, "WAVE"); w(12, "fmt "); v.setUint32(16, 16, true);
    v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, 8000, true); v.setUint32(28, 16000, true);
    v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, "data"); v.setUint32(40, n * 2, true);
    return URL.createObjectURL(new Blob([b], { type: "audio/wav" }));
  })();

  async function render(s) {
    await loading;
    const amb = s.amb ? await loadAmbient(rateFor(s.min)) : null;
    return URL.createObjectURL(buildSession(s, amb));
  }

  async function start() {
    const my = ++gen;
    player.src = SILENCE; player.play().catch(() => {});
    session = { ...cfg };
    setRunning(true);
    $("phase").textContent = "Préparation...";
    let u;
    try { u = await render(session); }
    catch (err) { if (my === gen) { stop(); alert("Préparation impossible : " + err.message); } return; }
    if (my !== gen) { URL.revokeObjectURL(u); return; }
    url = u;
    player.src = url;
    player.currentTime = 0;
    if ("mediaSession" in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: `Cohérence cardiaque ${session.i}/${session.e} s`,
        artist: "Respirelax 2.0",
        album: `${session.min} min`,
        artwork: [{ src: "/respirelax/icon-512.png", sizes: "512x512", type: "image/png" }],
      });
      navigator.mediaSession.setActionHandler("play", () => player.play());
      navigator.mediaSession.setActionHandler("pause", () => player.pause());
      navigator.mediaSession.setActionHandler("stop", stop);
    }
    try { await player.play(); } catch (err) { stop(); alert("Lecture impossible : " + err.message); }
  }

  // Changement d'ambiance ou de volume pendant une séance : on refait le mixage
  // et on reprend exactement au même endroit.
  let remixT;
  function remix() {
    if (!running || !url) return;
    clearTimeout(remixT);
    remixT = setTimeout(async () => {
      const my = gen, s = { ...session, amb: cfg.amb, vg: cfg.vg, va: cfg.va };
      let u;
      try { u = await render(s); } catch (err) { alert("Mise à jour impossible : " + err.message); return; }
      if (my !== gen || !running) { URL.revokeObjectURL(u); return; }
      const t = player.currentTime, paused = player.paused, old = url;
      session = s; url = u;
      player.src = url;
      player.addEventListener("loadedmetadata", () => {
        player.currentTime = t;
        if (!paused) player.play().catch(() => {});
      }, { once: true });
      URL.revokeObjectURL(old);
    }, 250);
  }

  function renderSound() {
    $("music").classList.toggle("on", cfg.amb);
    $("vg").value = cfg.vg; $("va").value = cfg.va;
    $("vgVal").textContent = `${cfg.vg} %`; $("vaVal").textContent = `${cfg.va} %`;
  }
  $("music").onclick = () => {
    cfg.amb = !cfg.amb; store.set(cfg); renderSound();
    if (cfg.amb) loadAmbient(rateFor(running ? session.min : cfg.min)).catch(() => {});
    remix();
  };
  $("vol").onclick = () => $("volBg").classList.add("open");
  $("volOk").onclick = () => $("volBg").classList.remove("open");
  $("volBg").addEventListener("click", (e) => { if (e.target === $("volBg")) $("volOk").onclick(); });
  ["vg", "va"].forEach((k) => {
    $(k).addEventListener("input", () => { cfg[k] = +$(k).value; renderSound(); });
    $(k).addEventListener("change", () => { store.set(cfg); remix(); });
  });

  player.addEventListener("ended", () => { if (url && player.src === url) setTimeout(stop, 300); });
  $("start").onclick = () => (running ? stop() : start());

  renderCfg(); markSel(); renderSound();
  if (cfg.amb) loadAmbient(rateFor(cfg.min)).catch(() => {});
  requestAnimationFrame(() => { scrollToSel(false); setBall(0); });
  window.addEventListener("resize", () => { if (!running) setBall(0); });
})();
</script>
</body>
</html>
